<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrçaFácil</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23f05a28'/%3E%3Crect x='30' y='25' width='40' height='50' rx='6' fill='none' stroke='%23fff' stroke-width='6'/%3E%3Cline x1='40' y1='38' x2='60' y2='38' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='50' r='3.5' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='3.5' fill='%23fff'/%3E%3Ccircle cx='60' cy='50' r='3.5' fill='%23fff'/%3E%3Ccircle cx='40' cy='60' r='3.5' fill='%23fff'/%3E%3Ccircle cx='50' cy='60' r='3.5' fill='%23fff'/%3E%3Ccircle cx='60' cy='60' r='3.5' fill='%23fff'/%3E%3Ccircle cx='40' cy='70' r='3.5' fill='%23fff'/%3E%3Cline x1='50' y1='70' x2='60' y2='70' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

    :root {
      --bg: #F5F4EF;
      --surface: #FFFFFF;
      --surface-sunk: #EFEDE5;
      --ink: #1B2130;
      --ink-soft: #5B6172;
      --ink-faint: #9BA0AC;
      --border: #E6E2D6;
      --border-strong: #D8D3C4;
      --accent: #FF6B35;
      --accent-dark: #E4531B;
      --accent-soft: #FFE7DB;
      --money: #17835A;
      --money-dark: #116644;
      --money-soft: #DFF2E9;
      --navy: #161B26;
      --danger: #D0433A;
      --mp: #009EE3;
      --stripe: #5C54D6;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .disp {
      font-family: 'Space Grotesk', ui-sans-serif, sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    a {
      color: inherit;
    }

    /* ---------- layout utils ---------- */
    .flex {
      display: flex;
    }

    .col {
      flex-direction: column;
    }

    .items-center {
      align-items: center;
    }

    .justify-center {
      justify-content: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .gap-1 {
      gap: 6px;
    }

    .gap-2 {
      gap: 10px;
    }

    .gap-3 {
      gap: 14px;
    }

    .gap-4 {
      gap: 18px;
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid-3 {
      grid-template-columns: 1fr;
    }

    @media(min-width:860px) {
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .w-full {
      width: 100%;
    }

    .hide-mobile {
      display: none;
    }

    .hide-desktop {
      display: flex;
    }

    @media(min-width:860px) {
      .hide-mobile {
        display: flex;
      }

      .hide-desktop {
        display: none;
      }
    }

    /* ---------- animations ---------- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp .45s ease both;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(23, 131, 90, .35);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(23, 131, 90, 0);
      }
    }

    .pulse {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spin {
      animation: spin .8s linear infinite;
    }

    @keyframes arcIn {
      from {
        stroke-dashoffset: var(--len);
      }

      to {
        stroke-dashoffset: var(--off);
      }
    }

    .arc {
      animation: arcIn 1.1s cubic-bezier(.22, .9, .3, 1) both;
    }

    /* ---------- primitives ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 8px 20px -8px rgba(228, 83, 27, .55);
    }

    .logo svg {
      width: 28px;
      height: 28px;
    }

    .field {
      display: block;
      margin-bottom: 0;
    }

    .field label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .field .req {
      color: var(--accent);
    }

    .field .wrap {
      margin-top: 8px;
    }

    .field .err {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--danger);
    }

    .input {
      height: 52px;
      width: 100%;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      padding: 0 16px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: all .15s;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    textarea.input {
      height: auto;
      padding: 14px;
      resize: vertical;
      line-height: 1.5;
    }

    .input.err-border {
      border-color: var(--danger);
    }

    .btn {
      height: 56px;
      width: 100%;
      border-radius: 18px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .1s;
      background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn.money {
      background: linear-gradient(180deg, var(--money), var(--money-dark));
    }

    .btn.ink {
      background: linear-gradient(180deg, var(--ink), #0E1220);
    }

    .btn.mp {
      background: var(--mp);
    }

    .btn.stripe {
      background: var(--stripe);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .link {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .seg {
      display: inline-flex;
      padding: 4px;
      border-radius: 999px;
      background: var(--surface-sunk);
      gap: 2px;
    }

    .seg button {
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .seg button.active {
      background: var(--ink);
      color: #fff;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ---------- auth ---------- */
    #app {
      min-height: 100vh;
    }

    .auth-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      margin-top: 32px;
    }

    /* ---------- app shell ---------- */
    .app-shell {
      display: flex;
      min-height: 100vh;
      overflow-y: auto;
    }

    .sidebar {
      width: 256px;
      flex-shrink: 0;
      background: var(--navy);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
      margin-bottom: 32px;
    }

    .sidebar .brand p.name {
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
    }

    .sidebar .brand p.hello {
      color: #8A93A8;
      font-size: 12px;
      margin: 2px 0 0;
    }

    .navitem {
      height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 14px;
      color: #B7BECC;
      margin-bottom: 4px;
      width: 100%;
      text-align: left;
    }

    .navitem.active {
      background: var(--accent);
      color: #fff;
    }

    .navitem svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .sidebar .logout {
      margin-top: auto;
      color: #8A93A8;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 24px 20px 120px;
    }

    @media(min-width:860px) {
      .main {
        padding: 40px 44px 120px;
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .topbar p {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--ink-soft);
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .bottomnav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottomnav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 0;
      min-height: 60px;
      color: var(--ink-faint);
    }

    .bottomnav button.active {
      color: var(--accent);
    }

    .bottomnav svg {
      width: 21px;
      height: 21px;
    }

    .bottomnav span {
      font-size: 11px;
      font-weight: 600;
    }

    /* ---------- dashboard ---------- */
    .gauge-card {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .gauge-card .eyebrow {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
    }

    .gauge-num {
      font-size: 48px;
      font-weight: 700;
      margin: -8px 0 2px;
    }

    .gauge-card .sub {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 24px;
    }

    .gauge-card .cta {
      max-width: 280px;
      width: 100%;
    }

    .quote-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    .quote-row:first-child {
      border-top: none;
    }

    .quote-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface-sunk);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quote-icon svg {
      width: 17px;
      height: 17px;
      color: var(--ink-soft);
    }

    .quote-info {
      flex: 1;
      min-width: 0;
    }

    .quote-info p.name {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quote-info p.date {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--ink-faint);
    }

    .quote-value {
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ---------- config ---------- */
    .config-max {
      max-width: 640px;
    }

    .dropzone {
      margin-top: 8px;
      border-radius: 18px;
      border: 2px dashed var(--border);
      background: var(--surface-sunk);
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 0 16px;
      cursor: pointer;
    }

    .dropzone.drag {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .dropzone img {
      height: 64px;
      width: 64px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
    }

    .dropzone p.t1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .dropzone p.t2 {
      margin: 0;
      font-size: 12px;
      color: var(--ink-faint);
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .color-swatch {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      padding: 3px;
      background: var(--surface);
    }

    .color-preview {
      flex: 1;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap svg {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      width: 18px;
      height: 18px;
      color: var(--ink-faint);
    }

    .saved-msg {
      font-size: 14px;
      font-weight: 600;
      color: var(--money);
    }

    /* ---------- plans ---------- */
    .plan-card {
      position: relative;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .plan-card.popular {
      border: 2px solid var(--accent);
      box-shadow: 0 20px 40px -24px rgba(255, 107, 53, .35);
    }

    .plan-badge {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .plan-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
    }

    .plan-qty {
      font-size: 30px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    .plan-qty span {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .plan-price {
      font-size: 24px;
      font-weight: 700;
      margin: 16px 0 0;
    }

    .plan-price span {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-faint);
    }

    .plan-unit {
      font-size: 12px;
      color: var(--ink-faint);
      margin: 4px 0 0;
    }

    .plan-hr {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .plan-feats {
      list-style: none;
      margin: 0 0 24px;
      padding: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .plan-feats li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 14px;
      color: var(--ink-soft);
    }

    .plan-feats svg {
      width: 16px;
      height: 16px;
      color: var(--money);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ---------- checkout ---------- */
    .checkout-max {
      max-width: 440px;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 22px;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .summary-card {
      padding: 24px;
      margin-bottom: 24px;
    }

    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .summary-top .kicker {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      margin: 0;
    }

    .summary-top .pname {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0 0;
    }

    .summary-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
    }

    .summary-bottom .lbl {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .summary-bottom .val {
      font-size: 24px;
      font-weight: 700;
    }

    .pay-kicker {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      margin: 0 0 12px;
    }

    .pay-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pay-btns button {
      height: 56px;
      border-radius: 18px;
    }

    .secure-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-faint);
    }

    .secure-row svg {
      width: 15px;
      height: 15px;
    }

    .success-wrap {
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 0;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--money-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .success-icon svg {
      width: 30px;
      height: 30px;
      color: var(--money);
    }

    /* ---------- custom modal ---------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(27, 33, 48, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(27, 33, 48, 0.25);
    }

    .modal-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .modal-icon svg {
      width: 28px;
      height: 28px;
    }

    /* ---------- sidebar mobile off-canvas ---------- */
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 2000;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,0.25);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(27, 33, 48, 0.4);
        backdrop-filter: blur(2px);
        z-index: 1999;
      }
    }

    .quote-row .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 600px) {
      .quote-row {
        flex-wrap: wrap !important;
        gap: 12px !important;
      }
      .quote-row > div:first-child {
        flex: 0 0 100% !important;
        width: 100% !important;
      }
      .quote-row > div:last-child {
        flex: 0 0 auto !important;
        margin-left: auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-end !important;
      }
    }
  </style>

    function maskPhone(raw) {
      const d = raw.replace(/\D/g, "").slice(0, 11);
      if (d.length <= 2) return d.length ? "(" + d : "";
      if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
      if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
      return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    }
    function fmtMoney(v, sym) {
      sym = sym || "R$";
      const n = Number(v);

    }
        function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

        function openPDF(pdfUrl, clientName) {
          if (!pdfUrl || pdfUrl === "#") {
            alert("O PDF deste orçamento ainda não está pronto ou disponível.");
            return;
          }
          try {
            if (pdfUrl.startsWith("data:") || pdfUrl.startsWith("http") || pdfUrl.startsWith("blob:")) {
              window.open(pdfUrl, "_blank");
            } else {
              // assume it is a raw base64 string
              const byteCharacters = atob(pdfUrl);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], {type: 'application/pdf'});
              const blobUrl = URL.createObjectURL(blob);
              window.open(blobUrl, "_blank");
            }
          } catch(e) {
            console.error("Erro ao abrir PDF:", e);
            alert("Não foi possível processar o PDF recebido.");
          }
        }

    /* ============================================================

    let mediaRecorder = null;
    let audioChunks = [];

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/wav' });
          setState({ audioBlob: blob, recordingState: 'idle' });
        };
        
        mediaRecorder.start();
        setState({ recordingState: 'recording' });
      } catch (err) {
        console.error("Erro ao acessar microfone:", err);
        alert("Não foi possível acessar o microfone. Verifique as permissões de áudio.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
    }

    function clearAudio() {
      setState({ audioBlob: null, recordingState: 'idle' });

    /* SVG credit gauge (signature element) */
    function gaugeSVG(value, max) {
      max = max || 50;
      const r = 100, cx = 120, cy = 118;
      const len = Math.PI * r;
      const frac = Math.min(value / max, 1);
      const off = len - frac * len;
      return `<svg viewBox="0 0 240 140" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="var(--surface-sunk)" stroke-width="14" stroke-linecap="round"/>
    <path class="arc" d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"
      style="--len:${len}; --off:${off}; stroke-dasharray:${len}; stroke-dashoffset:${off};"/>
    <text x="${cx - r}" y="${cy + 18}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="JetBrains Mono, monospace">0</text>
    <text x="${cx + r}" y="${cy + 18}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="JetBrains Mono, monospace">${max}</text>
  </svg>`;
    }

    async function submitForgotStep1(e) {
      e.preventDefault();
      const f = state.forms.forgot;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (numLimpo.length < 10) {
        setState({ forms: { ...state.forms, forgot: { ...f, err: "Celular inválido." } } });
        return;
      }

      setState({ forms: { ...state.forms, forgot: { ...f, isLoading: true, err: "" } } });

      try {
        const resposta = await fetch("https://n8n.aetherisai.site/webhook/esqueci-codigo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: numLimpo })
        });

        const db = await resposta.json();

        if (resposta.ok && !db.erro) {
          setState({
            forms: {
              ...state.forms,
              forgot: { ...f, step: 2, isLoading: false, err: "" }
            }
          });
        } else {
          setState({
            forms: {
              ...state.forms,
              forgot: { ...f, isLoading: false, err: db.erro || "Erro ao enviar código. Tente novamente." }
            }
          });
        }
      } catch (err) {
        setState({
          forms: {
            ...state.forms,
            forgot: { ...f, isLoading: false, err: "Erro de conexão com o servidor." }
          }
        });
      }
    }

    async function submitForgotStep2(e) {
      e.preventDefault();
      const f = state.forms.forgot;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (!f.code.trim()) {
        setState({ forms: { ...state.forms, forgot: { ...f, err: "Preencha o código." } } });
        return;
      }
      if (f.newPass.length < 6) {
        setState({ forms: { ...state.forms, forgot: { ...f, err: "A senha deve ter pelo menos 6 caracteres." } } });
        return;
      }
      if (f.newPass !== f.confirmPass) {
        setState({ forms: { ...state.forms, forgot: { ...f, err: "As senhas não coincidem." } } });
        return;
      }

      setState({ forms: { ...state.forms, forgot: { ...f, isLoading: true, err: "" } } });

      try {
        const resposta = await fetch("https://n8n.aetherisai.site/webhook/esqueci-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: numLimpo, codigo: f.code.trim(), senha: f.newPass })
        });

        if (resposta.ok && !db.erro) {
          setState({

              ...state.ui,
              showSuccessModal: true,

            }

            }
          });
        }
      } catch (err) {
        setState({

            forgot: { ...f, isLoading: false, err: "Erro de conexão com o servidor." }
          }
        });
      }

        if (state.audioBlob) formData.append("audio", state.audioBlob, "audio.wav");

        const resposta = await fetch("https://n8n.aetherisai.site/webhook/gerar-orcamento", {
          method: "POST",
          body: formData
        });

        if (!resposta.ok) {
          throw new Error("Erro na comunicação com o servidor.");

        const textoResposta = await resposta.text();

        // Atualiza a tela com os dados REAIS do DeepSeek
        setState({
          view: "revisao_orcamento",

          ui: { ...state.ui, generatingDraft: false }

      } catch (err) {

    function abrirPDF(id) {
      // Usa String() para garantir que o ID do banco (número) e do HTML (texto) combinem
      const orcamento = state.orcamentos.find(o => String(o.id) === String(id));
      
      if (!orcamento || !orcamento.pdfUrl || orcamento.pdfUrl === '#') {
        alert("O PDF ainda não está disponível.");
        return;
      }

      try {
        // Remove o cabeçalho 'data:application/pdf;base64,' se existir, pegando só o código puro
        const base64Data = orcamento.pdfUrl.includes(',') ? orcamento.pdfUrl.split(',')[1] : orcamento.pdfUrl;
        
        // Decodifica o Base64 para caracteres binários
        const byteCharacters = atob(base64Data);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        
        // Monta o arquivo PDF físico (Blob) na memória do navegador
        const blob = new Blob([byteArray], { type: 'application/pdf' });
        const blobUrl = URL.createObjectURL(blob);
        
        // Abre na nova aba com o leitor nativo
        window.open(blobUrl, '_blank');
      } catch (err) {
        console.error("Erro ao decodificar o PDF:", err);
        alert("Ocorreu um erro ao decodificar o arquivo do banco de dados.");
      }
    }

    /* ============================================================
       CONFIG (white-label)
    ============================================================ */
    function screenConfig() {
      const cfg = state.config;
      const opts = SEGMENTOS.map(s => `<option value="${s}" ${cfg.segment === s ? 'selected' : ''}>${s}</option>`).join("");
      return `
  <div class="fade-up config-max">
    ${topbar("Sua marca", "Assim seus orçamentos em PDF ficam com a sua cara")}

    <div class="card" style="padding:24px; margin-bottom:20px;">
      <h2 class="disp" style="font-size:14px; font-weight:700; margin:0 0 16px;">Identidade visual</h2>

      <label style="font-size:14px; font-weight:600;">Logo</label>
      <div id="dropzone" class="dropzone ${state.ui.drag ? 'drag' : ''}" onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault(); setState({ui:{...state.ui, drag:true}});"
        ondragleave="setState({ui:{...state.ui, drag:false}});"
        ondrop="handleDrop(event)">
        <input id="fileInput" type="file" accept="image/*" style="display:none;" onchange="handleFile(this.files[0])">
        ${cfg.logo
          ? `<img src="${cfg.logo}" alt="Logo enviada">`
          : `${ic.upload}<p class="t1">Arraste sua logo aqui</p><p class="t2">ou clique para escolher um arquivo — PNG, JPG</p>`}
      </div>

      <div style="margin-top:24px;">
        <label style="font-size:14px; font-weight:600;">Cor primária do PDF</label>
        <div class="color-row">
          <input class="color-swatch" type="color" value="${cfg.color}" oninput="state.config.color=this.value; syncColor();">
          <input id="colorHex" class="input mono" style="max-width:150px; text-transform:uppercase;" value="${cfg.color}"
            oninput="state.config.color=this.value; syncColor();">
          <div id="colorPreview" class="color-preview" style="background:${cfg.color};">Pré-visualização</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:24px; margin-bottom:20px;">
      <h2 class="disp" style="font-size:14px; font-weight:700; margin:0 0 16px;">Perfil operacional</h2>
      <label style="font-size:14px; font-weight:600;">Seu segmento</label>
      <div class="select-wrap" style="margin-top:8px;">
        <select class="input" style="appearance:none; padding-right:40px;" onchange="state.config.segment=this.value;">${opts}</select>
        ${ic.chevronDown}
      </div>
    </div>

    <div class="card" style="padding:24px; margin-bottom:24px;">
      <h2 class="disp" style="font-size:14px; font-weight:700; margin:0 0 4px;">Regras de negócio</h2>
      <p style="font-size:12px; color:var(--ink-faint); margin:0 0 16px;">Impressa automaticamente em todos os orçamentos gerados.</p>
      <label style="font-size:14px; font-weight:600;">Condição de pagamento padrão <span class="req">*</span></label>
      <div style="margin-top:8px;">
        <textarea class="input ${state.ui.errTerms ? 'err-border' : ''}" rows="4" placeholder="Ex: 50% de entrada e 50% na conclusão do serviço. Válido por 15 dias."
          oninput="state.config.terms=this.value; if(state.ui.errTerms){ setState({ui:{...state.ui, errTerms:''}}); }">${esc(cfg.terms)}</textarea>
      </div>
      ${state.ui.errTerms ? `<span class="err" style="display:block; margin-top:6px;">${esc(state.ui.errTerms)}</span>` : ""}
    </div>

    <div class="flex items-center gap-4">
      <div style="max-width:280px; width:100%;"><button class="btn" onclick="saveConfig()">${ic.check}Salvar configurações</button></div>
      ${state.ui.saved ? `<span class="saved-msg fade-up">Configurações salvas.</span>` : ""}
    </div>
  </div>`;
    }

    function handleDrop(e) {
      e.preventDefault();
      setState({ ui: { ...state.ui, drag: false } });
      handleFile(e.dataTransfer.files[0]);
    }
    function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => setState({ config: { ...state.config, logo: reader.result } });
      reader.readAsDataURL(file);
    }
    function syncColor() {
      const hex = document.getElementById("colorHex");
      const prev = document.getElementById("colorPreview");
      if (hex) hex.value = state.config.color;
      if (prev) prev.style.background = state.config.color;
      document.querySelectorAll('.color-swatch').forEach(el => el.value = state.config.color);
    }
    async function saveConfig() {
      if (!state.config.terms.trim()) {
        setState({ ui: { ...state.ui, errTerms: "Preencha a condição de pagamento padrão." } });
        return;
      }

      try {
        const resposta = await fetch("https://n8n.aetherisai.site/webhook/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telefone: state.phone,
            segmento: state.config.segment,
            cor_primaria: state.config.color,
            logo_url: state.config.logo,
            condicoes_pagamento: state.config.terms
          })
        });

        if (resposta.ok) {
          setState({ ui: { ...state.ui, errTerms: "", saved: true } });
          setTimeout(() => setState({ ui: { ...state.ui, saved: false } }), 2600);
        } else {
          alert("Erro ao salvar as configurações. Tente novamente.");
        }
      } catch (err) {
        alert("Erro de comunicação com o servidor.");
      }
    }

       PLANS

    ${p.popular ? `<span class="plan-badge">Mais popular</span>` : ""}
    <span class="plan-name">${p.name}</span>
    <p class="plan-qty">${p.qty} <span>orçamentos</span></p>
    <p class="plan-price mono">${p.sym} ${Number(p.price).toLocaleString("pt-BR")}<span>${p.sub || ""}</span></p>
    ${p.unit ? `<p class="plan-unit">(${p.sym} ${p.unit} cada)</p>` : ""}
    <div class="plan-hr"></div>
    <ul class="plan-feats">${featHtml}</ul>
    <button class="btn ${p.popular ? '' : 'ink'}" onclick='selectPlan(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Escolher pacote</button>
  </div>`;
    }

    /* ============================================================
       CHECKOUT
    ============================================================ */

      const plan = state.selectedPlan;
      if (!plan) {
        return `<div class="fade-up checkout-max">${topbar("Checkout")}<p style="font-size:14px; color:var(--ink-soft);">Escolha um pacote na aba Planos para continuar.</p></div>`;

        return `

      <h1 class="disp" style="font-size:24px; font-weight:700; margin:0;">Pagamento confirmado</h1>
      <p style="font-size:14px; color:var(--ink-soft); margin:8px 0 32px;">

      </p>
      <div class="w-full"><button class="btn" onclick="setState({view:'dashboard'})">Ir para o início</button></div>

      return `

    <div class="card summary-card">
      <div class="summary-top">

        <span class="badge" style="background:var(--accent-soft); color:var(--accent-dark);">${typeof plan.qty === 'number' ? plan.qty + ' orçamentos' : 'Ilimitado'}</span>
      </div>
      <div class="summary-bottom">
        <span class="lbl">Total</span>
        <span class="val mono">${plan.sym} ${Number(plan.price).toLocaleString("pt-BR")}${plan.sub || ""}</span>

    <p class="pay-kicker">Escolha a forma de pagamento</p>

    function pay(method) {
      setState({ ui: { ...state.ui, paying: method } });
      setTimeout(() => {
        const plan = state.selectedPlan;
        const qty = typeof plan.qty === "number" ? plan.qty : 50;
        setState({ credits: state.credits + qty, ui: { ...state.ui, paying: null, checkoutDone: true } });
      }, 1400);
    }

    function closeSuccessModal() {
      const nextView = state.view === "forgot" ? "login" : state.view;
      const nextForms = { ...state.forms };
      if (state.view === "forgot") {
        nextForms.forgot = { step: 1, phone: "", code: "", newPass: "", confirmPass: "", err: "", isLoading: false };
      }
      setState({
        view: nextView,
        forms: nextForms,
        ui: { ...state.ui, showSuccessModal: false, successMessage: "" }
      });
    }

    /* ============================================================
       ROOT RENDER
    ============================================================ */
    function render() {
      const app = document.getElementById("app");
      const authViews = { login: screenLogin, signup: screenSignup, forgot: screenForgot };

      let html = "";
      if (authViews[state.view]) {
        html = authViews[state.view]();
      } else {
        let content = "";
        if (state.view === "dashboard") content = screenDashboard();
        else if (state.view === "orcamentos") content = screenOrcamentos();
        else if (state.view === "novo_orcamento") content = screenNovoOrcamento();
        else if (state.view === "revisao_orcamento") content = screenRevisao();
        else if (state.view === "config") content = screenConfig();
        else if (state.view === "plans") content = screenPlans();
        else if (state.view === "checkout") content = screenCheckout();
        else content = screenDashboard();

        html = `
      <div class="app-shell">
        ${sidebar()}
        <div class="main">${content}</div>
        ${bottomnav()}
      </div>`;
      }

      if (state.ui.showNoCreditsModal) {
        html += `
        <div class="modal-overlay">
          <div class="card modal-card fade-up">
            <div class="modal-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <h2 class="disp" style="margin: 0 0 10px; font-size: 20px; font-weight: 700; color: var(--ink);">Sem orçamentos disponíveis</h2>
            <p style="margin: 0 0 24px; font-size: 14px; color: var(--ink-soft); line-height: 1.5;">O seu saldo de créditos acabou. Para continuar gerando orçamentos profissionais por IA, adquira um novo pacote.</p>
            <div class="flex col gap-2">
              <button class="btn" onclick="setState({ view: 'plans', ui: { ...state.ui, showNoCreditsModal: false } })">Ver Planos</button>
              <button class="btn" style="background: var(--border-strong); color: var(--ink);" onclick="setState({ ui: { ...state.ui, showNoCreditsModal: false } })">Fechar</button>
            </div>
          </div>
        </div>`;
      }

      if (state.ui.sidebarOpen) {
        html += `
        <div class="sidebar-overlay" onclick="setState({ ui: { ...state.ui, sidebarOpen: false } })"></div>`;
      }

      if (state.ui.showSuccessModal) {
        html += `
        <div class="modal-overlay">
          <div class="card modal-card fade-up">
            <div class="modal-icon" style="background: var(--money-soft); color: var(--money); margin: 0 auto 20px;">
              <span style="width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;">${ic.check}</span>
            </div>
            <h2 class="disp" style="margin: 0 0 12px; font-size: 20px; font-weight: 700; color: var(--ink);">Sucesso</h2>
            <p style="margin: 0 0 24px; font-size: 14px; color: var(--ink-soft); line-height: 1.5;">${esc(state.ui.successMessage)}</p>
            <div class="w-full">
              <button class="btn" onclick="closeSuccessModal()">OK</button>
            </div>
          </div>
        </div>`;
      }

      app.innerHTML = html;
    }

    render();
  </script>
</body>

</html>

    /* ---------- Utility Helpers ---------- */
    function esc(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }

    function maskPhone(raw) {
      const d = raw.replace(/\D/g, "").slice(0, 11);
      if (d.length <= 2) return d.length ? "(" + d : "";
      if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
      if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
      return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    }

    async function submitLogin(e) {
      e.preventDefault();
      const f = state.forms.login;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (numLimpo.length < 10 || f.pass.length < 1) {
        return setState({ ui: { ...state.ui, authErr: "Preencha corretamente." } });
      }

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/login`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: numLimpo, senha: f.pass })
        });

        const db = await resposta.json();

        if (resposta.ok && !db.erro) {
          setState({
            view: "dashboard",
            name: db.nome || "Usuário",
            phone: numLimpo,
            credits: db.creditos || 10,
            plano: db.plano || "Gratis",
            config: {
              logo: db.logo_url || null,
              color: db.cor_primaria || "#4E7A27",
              segment: db.segmento || "Pedreiro",
              email: db.email || "",
              endereco: db.endereco || "",
              paymentMethods: db.meios_pagamento || ["Pix"],
              paymentRules: db.regras_pagamento || "Nenhuma consideração a respeito dos pagamentos.",
              orcamentos: db.orcamentos || [],
              notificacoes: db.notificacoes_whatsapp !== undefined ? db.notificacoes_whatsapp : true
            },
            ui: { ...state.ui, authErr: "" }
          });
        } else {
          setState({ ui: { ...state.ui, authErr: db.erro || "Telefone ou senha incorretos." } });
        }
      } catch (err) {
        setState({ ui: { ...state.ui, authErr: "Erro de conexão com o servidor." } });
      }
    }

    async function submitSignup(e) {
      e.preventDefault();
      const f = state.forms.signup;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (!f.name.trim()) return setState({ ui: { ...state.ui, authErr: "Informe seu nome." } });
      if (numLimpo.length < 10) return setState({ ui: { ...state.ui, authErr: "Celular inválido." } });
      if (f.pass.length < 6) return setState({ ui: { ...state.ui, authErr: "Senha curta." } });
      if (f.pass !== f.confirmPass) return setState({ ui: { ...state.ui, authErr: "As senhas não coincidem." } });

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/cadastro`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: f.name.trim(),
            telefone: numLimpo,
            senha: f.pass,
            email: (f.email || "").trim(),
            endereco: (f.endereco || "").trim()
          })
        });

        const dados = await resposta.json();

        if (resposta.ok && dados.status === "ok") {
          setState({
            view: "dashboard",
            name: f.name.trim(),
            phone: numLimpo,
            config: {
              ...state.config,
              email: (f.email || "").trim(),
              endereco: (f.endereco || "").trim()
            },
            ui: { ...state.ui, authErr: "" }
          });
        } else {
          setState({ ui: { ...state.ui, authErr: dados.erro || "Erro ao criar conta." } });
        }
      } catch (err) {
        setState({ ui: { ...state.ui, authErr: "Servidor offline ou erro de rede." } });
      }
    }

            </div>
            ${f.err ? `<p style="font-size:13px; font-weight:600; color:var(--danger); margin:-8px 0 12px;">${esc(f.err)}</p>` : `<div style="height:12px;"></div>`}

              ${f.isLoading ? `<span class="spin" style="display:inline-flex;">${ic.loader}</span> Processando...` : 'Redefinir Senha'}

          </form>
          <p style="text-align:center; margin:20px 0 0;"><button class="link" onclick="setState({forms:{...state.forms, forgot:{...state.forms.forgot, step:1, err:'', code:'', newPass:'', confirmPass:''}}})">Voltar para o passo anterior</button></p>
        `);

    async function submitForgotStep1(e) {
      e.preventDefault();
      const f = state.forms.forgot;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (numLimpo.length < 10) return setState({ forms: { ...state.forms, forgot: { ...f, err: "Celular inválido." } } });
      setState({ forms: { ...state.forms, forgot: { ...f, isLoading: true, err: "" } } });

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/esqueci-codigo`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: numLimpo })
        });
        const db = await resposta.json();
        if (resposta.ok && !db.erro) {
          setState({ forms: { ...state.forms, forgot: { ...f, step: 2, isLoading: false, err: "" } } });
        } else {
          setState({ forms: { ...state.forms, forgot: { ...f, isLoading: false, err: db.erro || "Erro ao enviar código." } } });
        }
      } catch (err) {
        setState({ forms: { ...state.forms, forgot: { ...f, isLoading: false, err: "Erro de conexão com o servidor." } } });
      }
    }

    async function submitForgotStep2(e) {
      e.preventDefault();
      const f = state.forms.forgot;
      const numLimpo = f.phone.replace(/\D/g, "");

      if (!f.code.trim()) return setState({ forms: { ...state.forms, forgot: { ...f, err: "Preencha o código." } } });
      if (f.newPass.length < 6) return setState({ forms: { ...state.forms, forgot: { ...f, err: "Mínimo 6 caracteres." } } });
      if (f.newPass !== f.confirmPass) return setState({ forms: { ...state.forms, forgot: { ...f, err: "Senhas não coincidem." } } });

      setState({ forms: { ...state.forms, forgot: { ...f, isLoading: true, err: "" } } });

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/esqueci-reset`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: numLimpo, codigo: f.code.trim(), senha: f.newPass })
        });
        const db = await resposta.json();
        if (resposta.ok && !db.erro) {
          setState({ ui: { ...state.ui, showSuccessModal: true, successMessage: "Sua senha foi alterada com sucesso!" } });
        } else {
          setState({ forms: { ...state.forms, forgot: { ...f, isLoading: false, err: db.erro || "Código inválido." } } });
        }
      } catch (err) {
        setState({ forms: { ...state.forms, forgot: { ...f, isLoading: false, err: "Erro de conexão com o servidor." } } });
      }
    }

    function showToast(msg) {
      let t = document.getElementById('toast-popup');
      
      if(!t) {
        // Cria o estilo forçado no HTML para driblar qualquer cache do style.css
        if (!document.getElementById('toast-style')) {
          const style = document.createElement('style');
          style.id = 'toast-style';
          style.innerHTML = `
            .toast-popup-custom {
              position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
              background: #1B2130; color: #FFF; padding: 12px 24px; border-radius: 99px;
              font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
              opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 99999;
              display: flex; align-items: center; gap: 8px;
            }
            .toast-popup-custom.show {
              transform: translateX(-50%) translateY(0); opacity: 1;
            }
          `;
          document.head.appendChild(style);
        }

        t = document.createElement('div');
        t.id = 'toast-popup';
        t.className = 'toast-popup-custom';
        document.body.appendChild(t);
      }
      
      // Ícone verdinho + Mensagem
      t.innerHTML = `<span style="color:#25D366; width:18px; height:18px; display:flex;">${ic.check}</span> ${esc(msg)}`;
      
      // Adiciona a animação de subir na tela
      setTimeout(() => t.classList.add('show'), 10);
      
      // Remove a animação (esconde o pop-up) depois de 3 segundos
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function saveProfile(e) {
      e.preventDefault();
      const payload = {
        telefone: state.phone,
        nome: state.name,
        email: state.config.email,
        endereco: state.config.endereco,
        segmento: state.config.segment,
        cor_primaria: state.config.color,
        logo_url: state.config.logo,
        meios_pagamento: state.config.paymentMethods,
        regras_pagamento: state.config.paymentRules,
        notificacoes_whatsapp: state.config.notificacoes
      };

      if (state.forms.profile.newPass && state.forms.profile.newPass.trim() !== "") {
        payload.senha = state.forms.profile.newPass;
      }

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/config`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (resposta.ok) {
          setState({ forms: { ...state.forms, profile: { ...state.forms.profile, saved: true, newPass: "" } } });
          setTimeout(() => setState({ forms: { ...state.forms, profile: { ...state.forms.profile, saved: false } } }), 2600);
        } else {
          alert("Erro ao salvar as informações do perfil.");
        }
      } catch (err) {
        alert("Erro de conexão com o servidor.");
      }
    }

    function handleDrop(e) {
      e.preventDefault();
      setState({ ui: { ...state.ui, drag: false } });
      handleFile(e.dataTransfer.files[0]);
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => setState({ config: { ...state.config, logo: reader.result } });
      reader.readAsDataURL(file);
    }

    function updateColor(val) {
      state.config.color = val;
      const hexInput = document.getElementById("colorHex");
      const badge = document.getElementById("colorPreviewBadge");
      if (hexInput) hexInput.value = val;
      if (badge) badge.style.background = val;

      // Realtime updates for live modal elements if open
      document.querySelectorAll('.pdf-header-band').forEach(el => el.style.background = val);
      document.querySelectorAll('.pdf-client-row').forEach(el => el.style.borderColor = val);
      document.querySelectorAll('.pdf-client-row strong').forEach(el => el.style.color = val);
      document.querySelectorAll('.pdf-table th').forEach(el => el.style.background = val);
      document.querySelectorAll('.pdf-table tr.total-bar td').forEach(el => el.style.background = val);
      document.querySelectorAll('.pdf-total-row').forEach(el => el.style.color = val);
      document.querySelectorAll('.pdf-total-val').forEach(el => el.style.borderColor = val);
      document.querySelectorAll('.pdf-logo-text').forEach(el => el.style.color = val);
    }

    function updateSegment(val) {
      state.config.segment = val;
    }

    function updateEmail(val) {
      state.config.email = val;
      document.querySelectorAll('.pdf-pro-email-wrap').forEach(el => {
        el.style.display = val && val.trim() !== "" ? "inline" : "none";
      });
      document.querySelectorAll('.pdf-pro-email').forEach(el => el.innerText = val || "");
    }

    function updateEndereco(val) {
      state.config.endereco = val;
      document.querySelectorAll('.pdf-pro-endereco-p').forEach(el => {
        el.style.display = val && val.trim() !== "" ? "block" : "none";
      });
      document.querySelectorAll('.pdf-pro-endereco').forEach(el => el.innerText = val || "");
    }

    function togglePayment(method, isChecked) {
      if (isChecked) {
        if (!state.config.paymentMethods.includes(method)) state.config.paymentMethods.push(method);
      } else {
        state.config.paymentMethods = state.config.paymentMethods.filter(m => m !== method);
      }
      if (state.ui.errTerms) setState({ ui: { ...state.ui, errTerms: "" } });
    }

    function updatePaymentRules(val) {
      state.config.paymentRules = val;
      if (state.ui.errTerms) setState({ ui: { ...state.ui, errTerms: "" } });
    }

    async function saveConfig() {
      if (state.config.paymentMethods.length === 0) {
        setState({ ui: { ...state.ui, errTerms: "Selecione ao menos um meio de pagamento." } });
        return;
      }
      if (!state.config.paymentRules.trim()) {
        setState({ ui: { ...state.ui, errTerms: "Preencha a regra de pagamento." } });
        return;
      }

      try {
        const resposta = await fetch(`${N8N_BASE_URL}/config`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telefone: state.phone,
            nome: state.name,
            email: state.config.email,
            endereco: state.config.endereco,
            segmento: state.config.segment,
            cor_primaria: state.config.color,
            logo_url: state.config.logo,
            meios_pagamento: state.config.paymentMethods,
            regras_pagamento: state.config.paymentRules,
            notificacoes_whatsapp: state.config.notificacoes
          })
        });

        if (resposta.ok) {
          setState({ ui: { ...state.ui, errTerms: "", saved: true } });
          setTimeout(() => setState({ ui: { ...state.ui, saved: false } }), 2600);
        } else {
          alert("Erro ao salvar as configurações. Tente novamente.");
        }
      } catch (err) {
        alert("Erro de comunicação com o servidor.");
      }
    }

                  <h3 style="margin: 8px 0 0 0; font-size: 26px; font-weight: 800;">Orçamento de Serviços</h3>
                  <p style="margin-top: 8px; font-size: 12px; color: #9CA3AF;">Emitido em ${dataEmissao} · Válido até ${dataValidade}</p>
                </div>
              </div>

              <!-- CONTEÚDO PRINCIPAL NO MOCKUP -->
              <div style="padding: 40px 50px; background: #FFF;">
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 40px; gap: 20px;">
                  <div style="flex: 1;">
                    <div style="font-size: 11px; font-weight: 800; color: ${corDestaque}; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; border-bottom: 1px solid #E5E7EB; padding-bottom: 8px;">Cliente</div>
                    <div style="font-size: 14px; line-height: 1.6; color: #4B5563;">
                      <strong style="font-size: 16px; color: #111827;">Maria Santos</strong><br>
                      (11) 98765-4321<br>
                      Av. Central, 456 - Centro
                    </div>
                  </div>
                  <div style="flex: 1;">
                    <div style="font-size: 11px; font-weight: 800; color: ${corDestaque}; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; border-bottom: 1px solid #E5E7EB; padding-bottom: 8px;">Prazos e Garantia</div>
                    <div style="font-size: 14px; line-height: 1.6; color: #4B5563;">
                      <strong style="color: #111827;">Início:</strong> A combinar após aprovação<br>
                      <strong style="color: #111827;">Validade:</strong> 30 dias<br>
                    </div>
                  </div>
                </div>

                <div style="font-size: 11px; font-weight: 800; color: ${corDestaque}; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; border-bottom: 2px solid #E5E7EB; padding-bottom: 8px;">O Que Está Incluído</div>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 12px;">
                  <thead>
                    <tr>
                      <th style="text-align: left; padding: 12px; color: #6B7280; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #E5E7EB;">Descrição do Serviço</th>
                      <th style="text-align: center; padding: 12px; color: #6B7280; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #E5E7EB;">Qtd.</th>
                      <th style="text-align: right; padding: 12px; color: #6B7280; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #E5E7EB;">Unitário (R$)</th>
                      <th style="text-align: right; padding: 12px; color: #6B7280; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid #E5E7EB;">Total (R$)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style="padding: 16px 12px; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;"><strong>Instalação e Acabamento</strong></td>
                      <td style="padding: 16px 12px; text-align:center; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">1</td>
                      <td style="padding: 16px 12px; text-align:right; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">450,00</td>
                      <td style="padding: 16px 12px; text-align:right; font-weight: 800; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;">450,00</td>
                    </tr>
                    <tr>
                      <td style="padding: 16px 12px; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;"><strong>Mão de Obra e Ajustes</strong></td>
                      <td style="padding: 16px 12px; text-align:center; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">2</td>
                      <td style="padding: 16px 12px; text-align:right; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">175,00</td>
                      <td style="padding: 16px 12px; text-align:right; font-weight: 800; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;">350,00</td>
                    </tr>
                    <tr>
                      <td style="padding: 16px 12px; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;"><strong>Aplicação de Selante</strong></td>
                      <td style="padding: 16px 12px; text-align:center; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">1</td>
                      <td style="padding: 16px 12px; text-align:right; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 13px;">200,00</td>
                      <td style="padding: 16px 12px; text-align:right; font-weight: 800; border-bottom: 1px solid #E5E7EB; color: #111827; font-size: 14px;">200,00</td>
                    </tr>
                  </tbody>
                </table>

                <div style="display: flex; justify-content: flex-end; margin-bottom: 45px; font-size: 13px; color: #6B7280;">
                  <div>Subtotal R$ 1.000,00</div>
                </div>

                <div style="margin-top: 20px;">
                  <div style="font-size: 11px; font-weight: 800; color: ${corDestaque}; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; border-bottom: 2px solid #E5E7EB; padding-bottom: 8px;">Formas de Pagamento</div>
                  
                  <div style="display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;">
                    ${htmlFormasPagamento}
                  </div>
                  
                  <div style="background: ${corPrimaria}; color: #FFF; padding: 24px 30px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
                    <div>
                      <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; color: #FCD34D; letter-spacing: 1px;">Investimento Total</div>
                      <div style="font-size: 12px; margin-top: 6px; color: #9CA3AF;">ou parcelado no cartão de crédito<br>R$ ${valorPixFormatado} no PIX à vista</div>
                    </div>
                    <div style="font-size: 38px; font-weight: 800;">R$ ${totalGeralFormatado}</div>
                  </div>
                  
                  <div style="margin-top: 40px; font-size: 12px; color: #6B7280; line-height: 1.6; padding-top: 20px; border-top: 1px solid #E5E7EB;">
                    <strong style="color: #111;">Regras e Condições da Proposta:</strong><br>
                    ${regrasPagamento.replace(/\n/g, '<br>')}
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>`;
    }

    /* ---------- Plans Screen (BRL / USD + Mercado Pago / Stripe) ---------- */
    function planCard(p) {
      const featHtml = t("features").map(f => `<li>${ic.check} ${f}</li>`).join("");
      const isUSD = state.currency === "USD";
      const btnClass = isUSD ? "gateway-btn stripe" : "gateway-btn mp";
      const btnIcon = isUSD ? ic.stripe : ic.mercadoPago;
      const btnText = isUSD ? t("buyBtnStripe") : t("buyBtnMP");

      return `
      <div class="plan-card ${p.popular ? 'popular' : ''}">
        ${p.popular ? `<span class="plan-badge">${t("popularBadge")}</span>` : ""}
        <span class="plan-name">${p.name}</span>
        <p class="plan-qty">${p.qty} <span>orçamentos</span></p>
        <p class="plan-price mono">${p.sym} ${Number(p.price).toLocaleString("pt-BR")}</p>
        ${p.unit ? `<p class="plan-unit">(${p.sym} ${p.unit} cada)</p>` : ""}
        <div class="plan-hr"></div>
        <ul class="plan-feats">${featHtml}</ul>
        <button class="${btnClass}" onclick='selectPlan(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
          <span style="width:18px; height:18px; display:inline-flex;">${btnIcon}</span> ${btnText}
        </button>
      </div>`;
    }

    function screenPlans() {
      const list = PLANS[state.currency];
      const cards = list.map(planCard).join("");

      return `
      <div class="fade-up">
        ${topbar(t("plansTitle"), t("plansSubtitle"))}
        
        <!-- Card de Cabeçalho dos Planos -->
        <div class="card" style="padding:20px; margin-bottom:20px; background:linear-gradient(135deg, var(--surface), var(--surface-sunk));">
          <div class="flex justify-between items-center" style="flex-wrap:wrap; gap:12px;">
            <div>
              <h2 class="disp" style="margin:0; font-size:20px; font-weight:700; color:var(--ink);">${t("plansTitle")}</h2>
              <p style="margin:4px 0 0; font-size:13px; color:var(--ink-soft);">${t("plansSubtitle")}</p>
            </div>
            <span class="badge" style="background:var(--navy); color:#fff; font-size:12px; padding:6px 14px;">Pacotes avulsos</span>
          </div>
        </div>

        <!-- Alternador de Moeda (BRL / USD) -->
        <div class="flex justify-between items-center" style="margin-bottom:20px; flex-wrap:wrap; gap:12px;">
          <div class="seg">
            <button class="${state.currency === 'BRL' ? 'active' : ''}" onclick="setState({currency:'BRL'})">🇧🇷 R$ BRL (Mercado Pago)</button>
            <button class="${state.currency === 'USD' ? 'active' : ''}" onclick="setState({currency:'USD'})">🇺🇸 US$ USD (Stripe)</button>
          </div>
        </div>

        <!-- Grid de Cards de Planos -->
        <div class="grid grid-3">${cards}</div>
      </div>`;
    }

    function selectPlan(p) {
      setState({ selectedPlan: p, view: "checkout" });
    }

    /* ---------- Checkout Screen ---------- */
    function screenCheckout() {
      const plan = state.selectedPlan;
      if (!plan) {
        return `<div class="fade-up checkout-max">${topbar("Checkout")}<p style="font-size:14px; color:var(--ink-soft);">Escolha um pacote na aba Planos para continuar.</p></div>`;
      }
      const isUSD = state.currency === "USD";
      const btnClass = isUSD ? "btn stripe" : "btn mp";
      const gatewayName = isUSD ? "Stripe" : "Mercado Pago";

      return `
      <div class="fade-up" style="max-width:480px; margin:0 auto;">
        <button class="link" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;" onclick="goto('plans')">
          ${ic.arrowLeft} Voltar aos planos
        </button>
        
        <div class="card" style="padding:24px;">
          <h2 class="disp" style="font-size:20px; font-weight:700; margin:0 0 14px;">Confirmar Pedido</h2>
          
          <div style="background:var(--surface-sunk); padding:14px; border-radius:14px; margin-bottom:18px;">
            <div class="flex justify-between items-center">
              <span style="font-size:13px; font-weight:600;">Pacote ${esc(plan.name)} (${plan.qty} Orçamentos)</span>
              <span class="mono" style="font-size:16px; font-weight:700;">${plan.sym} ${Number(plan.price).toLocaleString("pt-BR")}</span>
            </div>
          </div>

          <p style="font-size:12px; color:var(--ink-soft); margin-bottom:18px; line-height:1.4;">
            Ao clicar no botão abaixo você será redirecionado para o ambiente seguro do <strong>${gatewayName}</strong> para concluir o pagamento.
          </p>

          <button class="${btnClass}" onclick="processPayment('${gatewayName}')">
            ${ic.lock} Pagar com ${gatewayName}
          </button>

          <div class="flex items-center justify-center gap-2" style="margin-top:16px; font-size:11px; color:var(--ink-faint);">
            ${ic.shield} Pagamento 100% Criptografado &amp; Seguro
          </div>
        </div>
      </div>`;
    }

    function processPayment(gateway) {
      alert(`Redirecionando para o gateway seguro ${gateway}...`);
      setState({ credits: state.credits + (state.selectedPlan ? state.selectedPlan.qty : 10), view: "dashboard" });
    }

    function closeSuccessModal() {
      const nextView = state.view === "forgot" ? "login" : state.view;
      const nextForms = { ...state.forms };
      if (state.view === "forgot") {
        nextForms.forgot = { step: 1, phone: "", code: "", newPass: "", confirmPass: "", err: "", isLoading: false };
      }
      setState({
        view: nextView,
        forms: nextForms,
        ui: { ...state.ui, showSuccessModal: false, successMessage: "" }
      });
    }

    function settingsModalComponent() {
      const notifAtiva = state.config.notificacoes !== false;

      return `
      <div class="blur-overlay fade-up">
        <div class="card" style="width: 100%; max-width: 420px; padding: 24px; background: var(--surface);">
          <div class="flex justify-between items-center" style="margin-bottom: 20px;">
            <h2 class="disp" style="font-size: 18px; font-weight: 700; margin: 0; color: var(--ink);">${t("notifSettings")}</h2>
            <button style="background: none; border: none; cursor: pointer; color: var(--ink-soft);" onclick="setState({ui: {...state.ui, showSettingsModal: false}})">
              <span style="width: 20px; height: 20px; display: inline-flex;">${ic.close}</span>
            </button>
          </div>

          <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; line-height: 1.5;">
            ${t("notifDesc")}
          </p>

          <div class="flex justify-between items-center" style="background: var(--surface-sunk); padding: 14px 18px; border-radius: 12px; margin-bottom: 24px;">
            <span style="font-size: 14px; font-weight: 600; color: var(--ink);">${t("notifToggle")}</span>
            <label style="position: relative; display: inline-block; width: 48px; height: 26px;">
              <input type="checkbox" ${notifAtiva ? 'checked' : ''} onchange="toggleNotif(this.checked)" style="opacity: 0; width: 0; height: 0;">
              <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: ${notifAtiva ? 'var(--money)' : '#ccc'}; transition: .3s; border-radius: 34px;"></span>
              <span style="position: absolute; content: ''; height: 20px; width: 20px; left: ${notifAtiva ? '24px' : '3px'}; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%;"></span>
            </label>
          </div>

          <button class="btn accent-bg" onclick="saveSettingsModal()">${t("saveBtn")}</button>
        </div>
      </div>`;
    }

    function toggleNotif(val) {
      state.config.notificacoes = val;
      render();
    }

    async function saveSettingsModal() {
      try {
        await fetch(`${N8N_BASE_URL}/config`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telefone: state.phone,
            nome: state.name,
            email: state.config.email,
            endereco: state.config.endereco,
            segmento: state.config.segment,
            cor_primaria: state.config.color,
            logo_url: state.config.logo,
            meios_pagamento: state.config.paymentMethods,
            regras_pagamento: state.config.paymentRules,
            notificacoes_whatsapp: state.config.notificacoes
          })
        });
        showToast('Configurações salvas com sucesso!');
        setState({ui: {...state.ui, showSettingsModal: false}});
      } catch(e) {
        alert('Erro ao salvar.');
      }
    }

    /* ---------- Root Render Function ---------- */
    function render() {
      const app = document.getElementById("app");
      const authViews = { login: screenLogin, signup: screenSignup, forgot: screenForgot };

      let html = "";
      if (authViews[state.view]) {
        html = authViews[state.view]();
      } else {
        let content = "";
        if (state.view === "dashboard") content = screenDashboard();
        else if (state.view === "orcamentos") content = screenOrcamentos();
        else if (state.view === "plans") content = screenPlans();
        else if (state.view === "perfil") content = screenProfile();
        else if (state.view === "checkout") content = screenCheckout();
        else content = screenDashboard();

        html = `
        <div class="app-shell">
          ${sidebar()}
          <div class="main-wrapper">
            <div class="main">${content}</div>
            ${corpFooter()}
          </div>
        </div>
        ${whatsappFAB()}`;
      }

      if (state.ui.sidebarOpen) {
        html += `<div class="sidebar-overlay" onclick="setState({ ui: { ...state.ui, sidebarOpen: false } })"></div>`;
      }

      if (state.ui.showMockupModal) {
        html += mockupModalComponent();
      }

      if (state.ui.showSettingsModal) {
        html += settingsModalComponent();
      }

      if (state.ui.showSuccessModal) {
        html += `
        <div class="modal-overlay">
          <div class="card modal-card fade-up">
            <div class="modal-icon" style="background: var(--money-soft); color: var(--money);">
              <span style="width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;">${ic.check}</span>
            </div>
            <h2 class="disp" style="margin: 0 0 12px; font-size: 20px; font-weight: 700; color: var(--ink);">Sucesso</h2>
            <p style="margin: 0 0 24px; font-size: 14px; color: var(--ink-soft); line-height: 1.5;">${esc(state.ui.successMessage)}</p>
            <div class="w-full">
              <button class="btn" onclick="closeSuccessModal()">OK</button>
            </div>
          </div>
        </div>`;
      }

      app.innerHTML = html;
    }

    // Initial render
    document.addEventListener("DOMContentLoaded", () => {
      render();
    });


  </script>
</body>

</html>

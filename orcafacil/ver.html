<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Orçamento Seguro</title>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #F5F4EF; font-family: sans-serif; 
            margin: 0; color: #1B2130; flex-direction: column; text-align: center;
        }
        .loader { 
            border: 4px solid #E6E2D6; border-top: 4px solid #4E7A27; 
            border-radius: 50%; width: 48px; height: 48px; 
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        p { font-size: 15px; font-weight: 600; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status-text">Buscando seu orçamento seguro...</p>

    <script>
        // Pega o ID da URL (ex: ?id=12)
        const urlParams = new URLSearchParams(window.location.search);
        const idOrcamento = urlParams.get('id');

        if(idOrcamento) {
            // Faz a requisição pro n8n para pegar a URL do PDF e marcar como "Visualizado"
            fetch('/api/ver-orcamento?id=' + idOrcamento)
            .then(r => r.json())
            .then(data => {
                if(data.url) {
                    document.getElementById('status-text').innerText = "Abrindo documento...";
                    window.location.replace(data.url); // Redireciona o cliente direto pro PDF
                } else {
                    document.getElementById('status-text').innerText = "Orçamento não encontrado ou expirado.";
                    document.querySelector('.loader').style.display = 'none';
                }
            })
            .catch(() => {
                document.getElementById('status-text').innerText = "Erro ao carregar o sistema.";
                document.querySelector('.loader').style.display = 'none';
            });
        } else {
            document.getElementById('status-text').innerText = "ID do orçamento não fornecido.";
            document.querySelector('.loader').style.display = 'none';
        }
    </script>
</body>
</html>
